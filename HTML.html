<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container">
        <div class="todo-app">
            <div class="header-section">
                <div class="icon-wrapper">
                    <span class="icon">✨</span>
                </div>
                <h1>My Tasks</h1>
                <p class="subtitle">Organize your day, achieve your goals</p>
            </div>
            
            <div class="input-section">
                <div class="input-wrapper">
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                    <input 
                        type="text" 
                        id="taskInput" 
                        placeholder="What needs to be done today?"
                        autocomplete="off"
                    >
                </div>
                <button id="addBtn" class="add-btn">
                    <span>Add Task</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </div>

            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">
                    <span class="filter-count" id="allCount">0</span>
                    All
                </button>
                <button class="filter-btn" data-filter="active">
                    <span class="filter-count" id="activeCount">0</span>
                    Active
                </button>
                <button class="filter-btn" data-filter="completed">
                    <span class="filter-count" id="completedCount">0</span>
                    Done
                </button>
            </div>

            <ul id="taskList" class="task-list"></ul>

            <div class="task-counter">
                <div class="counter-info">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span id="taskCount">0 tasks remaining</span>
                </div>
                <button id="clearCompleted" class="clear-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    Clear Completed
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
